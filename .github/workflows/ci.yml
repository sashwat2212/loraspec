name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    name: Lint, Typecheck & Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright strict typecheck
        run: uv run pyright

      - name: Unit tests
        run: uv run pytest -v

      - name: CLI smoke check
        run: |
          uv run loraspec --version
          uv run loraspec doctor
