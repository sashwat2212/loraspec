name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    name: Lint, Typecheck & Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright strict typecheck
        run: uv run pyright

      - name: Unit & integration tests (zero-dependency pure Python)
        run: uv run pytest -v

      - name: Verify [spectral] NumPy BLAS/LAPACK numerical parity
        run: |
          uv sync --frozen --extra spectral
          uv run pytest tests/unit/test_safetensors_and_math.py tests/unit/test_knots_aligner.py -v

      - name: CLI smoke check
        run: |
          uv run loraspec --version
          uv run loraspec doctor

      - name: Build wheel & out-of-tree /tmp smoke test
        run: |
          uv build
          WHEEL="$(ls dist/loraspec-*.whl | head -n 1)"
          cd /tmp
          uvx --from "${GITHUB_WORKSPACE}/${WHEEL}" loraspec --version
          uvx --from "${GITHUB_WORKSPACE}/${WHEEL}" loraspec doctor

      - name: Verify [kernels] PyTorch CPU M2 router, parity & bench smoke
        run: |
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv run --no-sync loraspec doctor
          uv run --no-sync pytest tests/unit/test_arrow_router.py tests/unit/test_kernel_reference_parity.py tests/unit/test_bench_smoke.py tests/integration/test_m2_solidification.py -v
          uv run --no-sync loraspec bench --synthetic --smoke --out-dir /tmp/ci-bench
          rm -rf /tmp/ci-bench

      - name: Verify [studio] FastAPI gateway & vLLM plugin integration
        run: |
          uv sync --frozen --extra spectral --extra studio
          uv run --no-sync loraspec doctor
          uv run --no-sync pytest tests/integration/test_vllm_plugin.py tests/integration/test_gateway_replay.py -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build React 19 Studio & run Playwright E2E + XSS suite
        working-directory: ui
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Verify multi-stage Docker container & <30s DEMO_REPLAY healthcheck
        run: |
          docker compose up -d --build --wait
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          docker compose down -v
