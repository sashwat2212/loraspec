services:
  loraspec-studio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEMO_REPLAY: "true"
      LORASPEC_UI_DIST: /app/ui/dist
      LORASPEC_REPLAY_DIR: /app/assets/demo_replays
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  loraspec-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DEMO_REPLAY: "false"
      LORASPEC_MOLORA_ENABLE: "1"
      LORASPEC_UI_DIST: /app/ui/dist
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
